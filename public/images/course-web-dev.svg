<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-label="Full-Stack Web Development Course">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0e3a5a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="440" y1="0" x2="440" y2="400" />
    <line x1="520" y1="0" x2="520" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="0" y1="80" x2="640" y2="80" />
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="240" x2="640" y2="240" />
    <line x1="0" y1="320" x2="640" y2="320" />
  </g>

  <!-- Inner border card -->
  <rect x="24" y="24" width="592" height="352" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Code editor illustration mock -->
  <rect x="56" y="52" width="528" height="150" rx="10" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
  <circle cx="76" cy="72" r="5" fill="#ef4444" />
  <circle cx="94" cy="72" r="5" fill="#f59e0b" />
  <circle cx="112" cy="72" r="5" fill="#10b981" />
  <text x="140" y="76" fill="#64748b" font-family="'Courier New', monospace" font-size="12">App.tsx — Next.js + React</text>

  <!-- Code snippet lines -->
  <text x="76" y="110" fill="#f43f5e" font-family="'Courier New', monospace" font-size="13">const <tspan fill="#38bdf8">createSession</tspan> = <tspan fill="#e2e8f0">async</tspan> () => &#123;</text>
  <text x="96" y="132" fill="#94a3b8" font-family="'Courier New', monospace" font-size="13"><tspan fill="#f59e0b">await</tspan> tutor.<tspan fill="#38bdf8">livePairProgramming</tspan>(&#123; stack: <tspan fill="#a7f3d0">'Full-Stack'</tspan> &#125;);</text>
  <text x="76" y="154" fill="#f43f5e" font-family="'Courier New', monospace" font-size="13">&#125;;</text>
  <text x="76" y="176" fill="#10b981" font-family="'Courier New', monospace" font-size="12">// Deploy with Next.js, TypeScript &amp; PostgreSQL</text>

  <!-- Category Tag -->
  <rect x="56" y="228" width="160" height="28" rx="14" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
  <text x="136" y="247" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">WEB DEVELOPMENT</text>

  <!-- Main Title -->
  <text x="56" y="292" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">Full-Stack Web Development</text>

  <!-- Subtitle -->
  <text x="56" y="324" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">React • Next.js • TypeScript • REST &amp; SQL Databases</text>

  <!-- Level & badge -->
  <rect x="56" y="342" width="90" height="20" rx="4" fill="#1e293b" />
  <text x="101" y="356" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">1-on-1 Lessons</text>
